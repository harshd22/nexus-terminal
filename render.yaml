services:
  # 1. FastAPI Python Backend Service
  - type: web
    name: nexus-terminal-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./nexus.db

  # 2. Next.js Frontend Service
  - type: web
    name: nexus-terminal-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://nexus-terminal-backend.onrender.com
